[package]
name = "akilli-dock"
version = "0.3.0"
description = "Akilli Dock"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "akilli_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# png: ikonlar; jpeg/bmp/webp: duvar kâğıdı okuma + bulanık şerit (7.2)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# WinRT async işlemlerini beklemek (`.join()`) ve tip dönüşümü için; windows 0.62 ile aynı.
windows-future = "0.3"
# COM geri çağrıları (`#[implement]`) bu adla doğrudan bağımlılık ister.
windows-core = "0.62"
# Bildirim ayarları (Windows kutucuklarını kapat / geri aç).
windows-registry = "0.6"

# Uygulama yalnızca Windows için. Tauri ile aynı sürüm (0.62) — HWND tipleri birebir uyuşsun.
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Devices_Radios",
  "Devices_WiFi",
  "Foundation",
  "ApplicationModel",
  "Data_Xml_Dom",
  "UI_Notifications_Management",
  "UI_Notifications",
  "Foundation_Collections",
  "Media_Control",
  "Networking_Connectivity",
  "Security_Credentials",
  "UI_ViewManagement",
  "Storage_Streams",
  "Web_Http",
  "Web_Http_Filters",
  "Web_Http_Headers",
  "Win32_Devices_Bluetooth",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security_Cryptography",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Wmi",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-updater = "2"


# Geliştirmede resim çözme/bulanıklaştırma optimizasyonsuz çok yavaş (4K JPEG saniyeler);
# yalnızca bu bağımlılıklar optimize edilir, kendi kodumuz hızlı derlenmeye devam eder.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
