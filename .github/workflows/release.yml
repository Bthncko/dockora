# Sürüm yayımlama: `npm run release 0.2.0` → v0.2.0 etiketi gönderilir →
# bu iş akışı Windows kurulum dosyasını derler, güncelleme imzasıyla imzalar
# ve GitHub Releases'e koyar. Kurulu dock'lar `latest.json`'dan yeni sürümü
# görüp kendini günceller (src-tauri/src/services/updater.rs).
#
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           %USERPROFILE%\.tauri\akilli-dock.key içeriği
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  %USERPROFILE%\.tauri\akilli-dock.key.password içeriği
name: Sürüm yayımla

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dockora ${{ github.ref_name }}"
          releaseBody: |
            **Kurulum:** aşağıdaki `..._x64-setup.exe` dosyasını indirip çalıştır.
            Dockora zaten kuruluysa bu sürüm kendiliğinden gelir.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
